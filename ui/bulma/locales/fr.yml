    reports:
      intro: "Un rapport se compose de lignes (titres, textes, formules, listes de comptes) et de colonnes (périodes ou formules sur les colonnes). Les montants sont lus dans la Comptabilité avec vos droits : ce que vous ne pouvez pas voir n'y figure pas, et c'est signalé."
      none: "Aucun rapport. Créez-en un, installez une définition fournie ou importez un fichier de définitions."
      new: "Nouveau rapport"
      edit: "Modifier le rapport"

      copied: "Copie « %{name} » créée."
      deleted: "Rapport supprimé."
    core:
      title: "Reprendre un rapport de la Comptabilité"
      intro: "Les rapports personnalisés de la Comptabilité s'écrivent dans la même syntaxe : la reprise crée un rapport avancé, une ligne de formule par ligne d'origine, que vous enrichissez ensuite."
